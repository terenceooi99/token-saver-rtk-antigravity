name: Publish to Open VSX & GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package VSIX
        run: npx @vscode/vsce package --out token-saver-rtk-ide.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        continue-on-error: true
        run: npx ovsx publish token-saver-rtk-ide.vsix -p "$OVSX_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: token-saver-rtk-ide.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}