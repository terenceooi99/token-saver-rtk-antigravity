name: Publish to Open VSX & GitHub Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Package VSIX
        run: npx @vscode/vsce package --out token-saver-rtk-antigravity.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish token-saver-rtk-antigravity.vsix -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: token-saver-rtk-antigravity.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}